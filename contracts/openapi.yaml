    PickSlotView:
      type: object
      properties:
        maxQty:
          type: integer
          format: int32
        minQty:
          type: integer
          format: int32
        sku:
          type: string
      required:
      - maxQty
      - minQty
      - sku
    PlanResultView:
      type: object
      properties:
        orders:
          type: integer
          format: int32
        pickTasks:
          type: integer
          format: int32
        preview:
          type: boolean
        replenishmentTasks:
          type: integer
          format: int32
        shortages:
          type: array
          items:
            $ref: "#/components/schemas/ShortageView"
        unitsAllocated:
          type: integer
          format: int32
        unitsShort:
          type: integer
          format: int32
          description: Units that could not be covered for orders in this wave
        waveNumber:
          type:
          - integer
          - "null"
          format: int64
          description: "Null for a preview, or when there was nothing to plan"
      required:
      - orders
      - pickTasks
      - preview
      - replenishmentTasks
      - shortages
      - unitsAllocated
      - unitsShort
    PlanWaveRequest:
      type: object
      properties:
        carrier:
          type:
          - string
          - "null"
          description: Only orders for this carrier
          maxLength: 30
          minLength: 0
        cutoffWithinHours:
          type:
          - integer
          - "null"
          format: int32
          description: Only orders whose carrier cutoff is within this many hours
          maximum: 168
          minimum: 1
        maxOrders:
          type:
          - integer
          - "null"
          format: int32
          description: How many orders the wave may cover; default 50
          maximum: 500
          minimum: 1
    Quantities:
      type: object
      properties:
        allocated:
          type: integer
          format: int32
        available:
          type: integer
          format: int32
        onHand:
          type: integer
          format: int32
      required:
      - allocated
      - available
      - onHand
    ReceiptRequest:
      type: object
      properties:
        location:
          type: string
          maxLength: 30
          minLength: 0
        quantity:
          type: integer
          format: int32
          exclusiveMinimum: 0
        reference:
          description: "What the receipt belongs to, e.g. a purchase order"
          oneOf:
          - $ref: "#/components/schemas/ReferenceBody"
          - type: "null"
        sku:
          type: string
          maxLength: 40
          minLength: 0
      required:
      - location
      - quantity
      - sku
    ReferenceBody:
      type: object
      properties:
        id:
