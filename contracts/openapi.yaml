openapi: 3.1.0
info:
  description: "Warehouse management core: inventory, orders, waves, tasks, and execution."
  title: WMS Core API
  version: v1
servers:
- description: Local development
  url: http://localhost:8080
tags:
- description: Stock by location and SKU
  name: Inventory
- description: "Zones, locations, and SKUs"
  name: Master data
paths:
  /api/v1/inventory:
    get:
      description: Stock per location and SKU. Balances with nothing on hand or allocated
        are omitted unless includeEmpty is true.
      operationId: listBalances
      parameters:
      - in: query
        name: sku
        required: false
        schema:
          type: string
      - in: query
        name: location
        required: false
        schema:
          type: string
      - in: query
        name: zone
        required: false
        schema:
          type: string
      - in: query
        name: type
        required: false
        schema:
          type: string
          enum:
          - FORWARD_PICK
          - RESERVE
          - STAGING
          - PACK
          - DOCK
      - in: query
        name: includeEmpty
        required: false
        schema:
          type: boolean
          default: false
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 500
          minimum: 1
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageBalanceView"
          description: OK
      summary: List inventory balances
      tags:
      - Inventory
  /api/v1/inventory/adjustments:
    post:
      description: "A signed correction with a mandatory reason, e.g. -4 for damaged\
        \ units."
      operationId: recordAdjustment
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustmentRequest"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MovementResultView"
          description: Created
      summary: Correct stock at a location
      tags:
      - Inventory
  /api/v1/inventory/moves:
    post:
      description: For example replenishment from reserve to forward-pick. All or
        nothing.
      operationId: recordMove
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveRequest"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MovementResultView"
          description: Created
      summary: Move stock between locations
      tags:
      - Inventory
  /api/v1/inventory/receipts:
    post:
      operationId: recordReceipt
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiptRequest"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MovementResultView"
          description: Created
      summary: Receive stock into a location
      tags:
      - Inventory
  /api/v1/inventory/transactions:
    get:
      description: Newest first.
      operationId: listTransactions
      parameters:
      - in: query
        name: sku
        required: false
        schema:
          type: string
      - in: query
        name: location
        required: false
        schema:
          type: string
      - in: query
        name: type
        required: false
        schema:
          type: string
          enum:
          - RECEIPT
          - PICK
          - MOVE
          - ADJUST
          - COUNT_VARIANCE
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 500
          minimum: 1
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageTransactionView"
          description: OK
      summary: List ledger entries
      tags:
      - Inventory
  /api/v1/inventory/transactions/{id}:
    get:
      operationId: getTransaction
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TransactionView"
          description: OK
      summary: Get a ledger entry
      tags:
      - Inventory
  /api/v1/locations:
    get:
      description: Optionally filtered by zone code and location type.
      operationId: listLocations
      parameters:
      - in: query
        name: zone
        required: false
        schema:
          type: string
      - in: query
        name: type
        required: false
        schema:
          type: string
          enum:
          - FORWARD_PICK
          - RESERVE
          - STAGING
          - PACK
          - DOCK
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 500
          minimum: 1
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageLocationView"
          description: OK
      summary: List locations
      tags:
      - Master data
  /api/v1/locations/{code}:
    get:
      description: Includes the pick slot for forward-pick locations.
      operationId: getLocation
      parameters:
      - in: path
        name: code
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LocationView"
          description: OK
      summary: Get a location
      tags:
      - Master data
  /api/v1/skus:
    get:
      operationId: listSkus
      parameters:
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 500
          minimum: 1
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageSkuView"
          description: OK
      summary: List SKUs
      tags:
      - Master data
  /api/v1/skus/{code}:
    get:
      operationId: getSku
      parameters:
      - in: path
        name: code
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SkuView"
          description: OK
      summary: Get a SKU
      tags:
      - Master data
  /api/v1/skus/{code}/availability:
    get:
      description: "Totals across the warehouse, broken down by location type (forward-pick,\
        \ reserve, ...)."
      operationId: getSkuAvailability
      parameters:
      - in: path
        name: code
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SkuAvailabilityView"
          description: OK
      summary: Get a SKU's availability
      tags:
      - Inventory
  /api/v1/zones:
    get:
      operationId: listZones
      parameters:
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 500
          minimum: 1
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageZoneView"
          description: OK
      summary: List zones
      tags:
      - Master data
components:
  schemas:
    ActorView:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum:
          - HUMAN
          - AGENT
          - SYSTEM
          - INTEGRATION
      required:
      - id
      - type
    AdjustmentRequest:
      type: object
      properties:
        location:
          type: string
          maxLength: 30
          minLength: 0
        quantity:
          type: integer
          format: int32
          description: "Signed change: positive adds stock, negative removes it. Must\
            \ not be 0."
        reason:
          type: string
          maxLength: 200
          minLength: 0
        sku:
          type: string
          maxLength: 40
          minLength: 0
      required:
      - location
      - quantity
      - reason
      - sku
    BalanceView:
      type: object
      properties:
        allocated:
          type: integer
          format: int32
        available:
          type: integer
          format: int32
        location:
          type: string
        locationType:
          type: string
          enum:
          - FORWARD_PICK
          - RESERVE
          - STAGING
          - PACK
          - DOCK
        onHand:
          type: integer
          format: int32
        sku:
          type: string
        zone:
          type: string
      required:
      - allocated
      - available
      - location
      - locationType
      - onHand
      - sku
      - zone
    LocationTypeAvailability:
      type: object
      properties:
        allocated:
          type: integer
          format: int32
        available:
          type: integer
          format: int32
        locationType:
          type: string
          enum:
          - FORWARD_PICK
          - RESERVE
          - STAGING
          - PACK
          - DOCK
        locations:
          type: integer
          format: int32
        onHand:
          type: integer
          format: int32
      required:
      - allocated
      - available
      - locationType
      - locations
      - onHand
    LocationView:
      type: object
      properties:
        active:
          type: boolean
        capacityUnits:
          type:
          - integer
          - "null"
          format: int32
        code:
          type: string
        pickSequence:
          type:
          - integer
          - "null"
          format: int32
          description: Walking order for pick-path sequencing
        pickSlot:
          description: Set for forward-pick slots
          oneOf:
          - $ref: "#/components/schemas/PickSlotView"
          - type: "null"
        requiredEquipment:
          type:
          - string
          - "null"
          description: "Equipment needed to reach it, e.g. REACH_TRUCK"
        type:
          type: string
          enum:
          - FORWARD_PICK
          - RESERVE
          - STAGING
          - PACK
          - DOCK
        zone:
          type: string
      required:
      - active
      - code
      - type
      - zone
    MoveRequest:
      type: object
      properties:
        fromLocation:
          type: string
          maxLength: 30
          minLength: 0
        quantity:
          type: integer
          format: int32
          exclusiveMinimum: 0
        sku:
          type: string
          maxLength: 40
          minLength: 0
        toLocation:
          type: string
          maxLength: 30
          minLength: 0
      required:
      - fromLocation
      - quantity
      - sku
      - toLocation
    MovementResultView:
      type: object
      properties:
        balances:
          type: array
          items:
            $ref: "#/components/schemas/BalanceView"
        transaction:
          $ref: "#/components/schemas/TransactionView"
      required:
      - balances
      - transaction
    PageBalanceView:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BalanceView"
        nextCursor:
          type:
          - string
          - "null"
          description: Opaque cursor for the next page; null on the last page
      required:
      - items
    PageLocationView:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LocationView"
        nextCursor:
          type:
          - string
          - "null"
          description: Opaque cursor for the next page; null on the last page
      required:
      - items
    PageSkuView:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SkuView"
        nextCursor:
          type:
          - string
          - "null"
          description: Opaque cursor for the next page; null on the last page
      required:
      - items
    PageTransactionView:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TransactionView"
        nextCursor:
          type:
          - string
          - "null"
          description: Opaque cursor for the next page; null on the last page
      required:
      - items
    PageZoneView:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ZoneView"
        nextCursor:
          type:
          - string
          - "null"
          description: Opaque cursor for the next page; null on the last page
      required:
      - items
    PickSlotView:
      type: object
      properties:
        maxQty:
          type: integer
          format: int32
        minQty:
          type: integer
          format: int32
        sku:
          type: string
      required:
      - maxQty
      - minQty
      - sku
    Quantities:
      type: object
      properties:
        allocated:
          type: integer
          format: int32
        available:
          type: integer
          format: int32
        onHand:
          type: integer
          format: int32
      required:
      - allocated
      - available
      - onHand
    ReceiptRequest:
      type: object
      properties:
        location:
          type: string
          maxLength: 30
          minLength: 0
        quantity:
          type: integer
          format: int32
          exclusiveMinimum: 0
        reference:
          description: "What the receipt belongs to, e.g. a purchase order"
          oneOf:
          - $ref: "#/components/schemas/ReferenceBody"
          - type: "null"
        sku:
          type: string
          maxLength: 40
          minLength: 0
      required:
      - location
      - quantity
      - sku
    ReferenceBody:
      type: object
      properties:
        id:
          type: string
          maxLength: 64
          minLength: 0
        type:
          type: string
          maxLength: 30
          minLength: 0
      required:
      - id
      - type
    ReferenceView:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
      required:
      - id
      - type
    SkuAvailabilityView:
      type: object
      properties:
        byLocationType:
          type: array
          items:
            $ref: "#/components/schemas/LocationTypeAvailability"
        sku:
          type: string
        total:
          $ref: "#/components/schemas/Quantities"
      required:
      - byLocationType
      - sku
      - total
    SkuView:
      type: object
      properties:
        active:
          type: boolean
        code:
          type: string
        description:
          type: string
        uom:
          type: string
        velocityClass:
          type:
          - string
          - "null"
          enum:
          - A
          - B
          - C
      required:
      - active
      - code
      - description
      - uom
    TransactionView:
      type: object
      properties:
        actor:
          $ref: "#/components/schemas/ActorView"
        fromLocation:
          type:
          - string
          - "null"
        id:
          type: integer
          format: int64
        occurredAt:
          type: string
          format: date-time
        quantity:
          type: integer
          format: int32
        reason:
          type:
          - string
          - "null"
        reference:
          oneOf:
          - $ref: "#/components/schemas/ReferenceView"
          - type: "null"
        sku:
          type: string
        toLocation:
          type:
          - string
          - "null"
        type:
          type: string
          enum:
          - RECEIPT
          - PICK
          - MOVE
          - ADJUST
          - COUNT_VARIANCE
      required:
      - actor
      - id
      - occurredAt
      - quantity
      - sku
      - type
    ZoneView:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
      required:
      - code
      - name
