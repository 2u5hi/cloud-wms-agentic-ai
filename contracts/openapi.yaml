openapi: 3.1.0
info:
  description: "Warehouse management core: inventory, orders, waves, tasks, and execution."
  title: WMS Core API
  version: v1
servers:
- description: Local development
  url: http://localhost:8080
tags:
- description: Stock by location and SKU
  name: Inventory
- description: Planning orders into waves of pick and replenishment work
  name: Waves
- description: Inbound interface from the host system (ERP / order management)
  name: Host integration
- description: Customer orders and their fulfilment status
  name: Orders
- description: "Zones, locations, and SKUs"
  name: Master data
paths:
  /api/v1/integrations/host/orders:
    post:
      description: "Each order is processed independently and gets its own result:\
        \ ACCEPTED, DUPLICATE (an order with this external reference already exists\
        \ and was not changed), or REJECTED with field errors. Returns 200 whenever\
        \ the batch itself is well formed, even if every order was rejected."
      operationId: importOrders
      parameters:
      - description: Unique per logical request. Retrying with the same key returns
          the original response instead of repeating the command.
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          maxLength: 100
          pattern: "^[A-Za-z0-9_.:\\-]{1,100}$"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderImportRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OrderImportResponse"
          description: OK
      summary: Import a batch of orders
      tags:
      - Host integration
  /api/v1/inventory:
    get:
      description: Stock per location and SKU. Balances with nothing on hand or allocated
        are omitted unless includeEmpty is true.
      operationId: listBalances
      parameters:
      - in: query
        name: sku
        required: false
        schema:
          type: string
      - in: query
        name: location
        required: false
        schema:
          type: string
      - in: query
        name: zone
        required: false
        schema:
          type: string
      - in: query
        name: type
        required: false
        schema:
          type: string
          enum:
          - FORWARD_PICK
          - RESERVE
          - STAGING
          - PACK
          - DOCK
      - in: query
        name: includeEmpty
        required: false
        schema:
          type: boolean
          default: false
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 500
          minimum: 1
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageBalanceView"
          description: OK
      summary: List inventory balances
      tags:
      - Inventory
  /api/v1/inventory/adjustments:
    post:
      description: "A signed correction with a mandatory reason, e.g. -4 for damaged\
        \ units."
      operationId: recordAdjustment
      parameters:
      - description: Unique per logical request. Retrying with the same key returns
          the original response instead of repeating the command.
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          maxLength: 100
          pattern: "^[A-Za-z0-9_.:\\-]{1,100}$"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustmentRequest"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MovementResultView"
          description: Created
      summary: Correct stock at a location
      tags:
      - Inventory
  /api/v1/inventory/moves:
    post:
      description: For example replenishment from reserve to forward-pick. All or
        nothing.
      operationId: recordMove
      parameters:
      - description: Unique per logical request. Retrying with the same key returns
          the original response instead of repeating the command.
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          maxLength: 100
          pattern: "^[A-Za-z0-9_.:\\-]{1,100}$"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveRequest"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MovementResultView"
          description: Created
      summary: Move stock between locations
      tags:
      - Inventory
  /api/v1/inventory/receipts:
    post:
      operationId: recordReceipt
      parameters:
      - description: Unique per logical request. Retrying with the same key returns
          the original response instead of repeating the command.
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          maxLength: 100
          pattern: "^[A-Za-z0-9_.:\\-]{1,100}$"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiptRequest"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MovementResultView"
          description: Created
      summary: Receive stock into a location
      tags:
      - Inventory
  /api/v1/inventory/transactions:
    get:
      description: Newest first.
      operationId: listTransactions
      parameters:
      - in: query
        name: sku
        required: false
        schema:
          type: string
      - in: query
        name: location
        required: false
        schema:
          type: string
      - in: query
        name: type
        required: false
        schema:
          type: string
          enum:
          - RECEIPT
          - PICK
          - MOVE
          - ADJUST
          - COUNT_VARIANCE
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 500
          minimum: 1
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageTransactionView"
          description: OK
      summary: List ledger entries
      tags:
      - Inventory
  /api/v1/inventory/transactions/{id}:
    get:
      operationId: getTransaction
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TransactionView"
          description: OK
      summary: Get a ledger entry
      tags:
      - Inventory
  /api/v1/locations:
    get:
      description: Optionally filtered by zone code and location type.
      operationId: listLocations
      parameters:
      - in: query
        name: zone
        required: false
        schema:
          type: string
      - in: query
        name: type
        required: false
        schema:
          type: string
          enum:
          - FORWARD_PICK
          - RESERVE
          - STAGING
          - PACK
          - DOCK
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 500
          minimum: 1
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageLocationView"
          description: OK
      summary: List locations
      tags:
      - Master data
  /api/v1/locations/{code}:
    get:
      description: Includes the pick slot for forward-pick locations.
      operationId: getLocation
      parameters:
      - in: path
        name: code
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LocationView"
          description: OK
      summary: Get a location
      tags:
      - Master data
  /api/v1/orders:
    get:
      description: In the order they were received.
      operationId: listOrders
      parameters:
      - in: query
        name: status
        required: false
        schema:
          type: string
          enum:
          - RECEIVED
          - ALLOCATED
          - RELEASED
          - PICKING
          - PICKED
          - PACKED
          - SHIPPED
          - CANCELLED
      - in: query
        name: onHold
        required: false
        schema:
          type: boolean
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 500
          minimum: 1
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageOrderSummaryView"
          description: OK
      summary: List orders
      tags:
      - Orders
  /api/v1/orders/{externalRef}:
    get:
      operationId: getOrder
      parameters:
      - in: path
        name: externalRef
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OrderView"
          description: OK
      summary: Get an order with its lines
      tags:
      - Orders
  /api/v1/skus:
    get:
      operationId: listSkus
      parameters:
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 500
          minimum: 1
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageSkuView"
          description: OK
      summary: List SKUs
      tags:
      - Master data
  /api/v1/skus/{code}:
    get:
      operationId: getSku
      parameters:
      - in: path
        name: code
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SkuView"
          description: OK
      summary: Get a SKU
      tags:
      - Master data
  /api/v1/skus/{code}/availability:
    get:
      description: "Totals across the warehouse, broken down by location type (forward-pick,\
        \ reserve, ...)."
      operationId: getSkuAvailability
      parameters:
      - in: path
        name: code
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SkuAvailabilityView"
          description: OK
      summary: Get a SKU's availability
      tags:
      - Inventory
  /api/v1/waves:
    get:
      operationId: listWaves
      parameters:
      - in: query
        name: status
        required: false
        schema:
          type: string
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 500
          minimum: 1
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageWaveSummaryView"
          description: OK
      summary: List waves
      tags:
      - Waves
  /api/v1/waves/plan:
    post:
      description: "Selects open orders, promises stock, and creates pick tasks plus\
        \ the replenishment they depend on. With preview=true nothing is written and\
        \ no stock is locked; the result is advisory."
      operationId: planWave
      parameters:
      - in: query
        name: preview
        required: false
        schema:
          type: boolean
          default: false
      - description: Unique per logical request. Retrying with the same key returns
          the original response instead of repeating the command.
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          maxLength: 100
          pattern: "^[A-Za-z0-9_.:\\-]{1,100}$"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanWaveRequest"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PlanResultView"
          description: OK
      summary: Plan a wave
      tags:
      - Waves
  /api/v1/waves/{number}:
    get:
      operationId: getWave
      parameters:
      - in: path
        name: number
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WaveView"
          description: OK
      summary: Get a wave with its orders and task counts
      tags:
      - Waves
  /api/v1/waves/{number}/cancel:
    post:
      description: "Cancels its work, releases the stock it promised, and returns\
        \ its orders to RECEIVED."
      operationId: cancelWave
      parameters:
      - in: path
        name: number
        required: true
        schema:
          type: integer
          format: int64
      - description: Unique per logical request. Retrying with the same key returns
          the original response instead of repeating the command.
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          maxLength: 100
          pattern: "^[A-Za-z0-9_.:\\-]{1,100}$"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WaveView"
          description: OK
      summary: Cancel a planned wave
      tags:
      - Waves
  /api/v1/waves/{number}/release:
    post:
      operationId: releaseWave
      parameters:
      - in: path
        name: number
        required: true
        schema:
          type: integer
          format: int64
      - description: Unique per logical request. Retrying with the same key returns
          the original response instead of repeating the command.
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          maxLength: 100
          pattern: "^[A-Za-z0-9_.:\\-]{1,100}$"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WaveView"
          description: OK
      summary: Release a wave to the floor
      tags:
      - Waves
  /api/v1/zones:
    get:
      operationId: listZones
      parameters:
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 500
          minimum: 1
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageZoneView"
          description: OK
      summary: List zones
      tags:
      - Master data
components:
  schemas:
    ActorView:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum:
          - HUMAN
          - AGENT
          - SYSTEM
          - INTEGRATION
      required:
      - id
      - type
    AdjustmentRequest:
      type: object
      properties:
        location:
          type: string
          maxLength: 30
          minLength: 0
        quantity:
          type: integer
          format: int32
          description: "Signed change: positive adds stock, negative removes it. Must\
            \ not be 0."
        reason:
          type: string
          maxLength: 200
          minLength: 0
        sku:
          type: string
          maxLength: 40
          minLength: 0
      required:
      - location
      - quantity
      - reason
      - sku
    BalanceView:
      type: object
      properties:
        allocated:
          type: integer
          format: int32
        available:
          type: integer
          format: int32
        location:
          type: string
        locationType:
          type: string
          enum:
          - FORWARD_PICK
          - RESERVE
          - STAGING
          - PACK
          - DOCK
        onHand:
          type: integer
          format: int32
        sku:
          type: string
        zone:
          type: string
      required:
      - allocated
      - available
      - location
      - locationType
      - onHand
      - sku
      - zone
    FieldError:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
      required:
      - field
      - message
    HostOrder:
      type: object
      properties:
        carrier:
          type: string
          maxLength: 30
          minLength: 0
        carrierCutoffAt:
          type: string
          format: date-time
        customer:
          type: string
          maxLength: 100
          minLength: 0
        externalRef:
          type: string
          maxLength: 64
          minLength: 0
        lines:
          type: array
          items:
            $ref: "#/components/schemas/HostOrderLine"
          maxItems: 200
          minItems: 0
        priority:
          type:
          - integer
          - "null"
          format: int32
          description: 1 (most urgent) to 5; defaults to 3
          maximum: 5
          minimum: 1
      required:
      - carrier
      - carrierCutoffAt
      - customer
      - externalRef
      - lines
    HostOrderLine:
      type: object
      properties:
        lineNo:
          type: integer
          format: int32
          exclusiveMinimum: 0
        quantity:
          type: integer
          format: int32
          exclusiveMinimum: 0
        sku:
          type: string
          maxLength: 40
          minLength: 0
      required:
      - lineNo
      - quantity
      - sku
    LocationTypeAvailability:
      type: object
      properties:
        allocated:
          type: integer
          format: int32
        available:
          type: integer
          format: int32
        locationType:
          type: string
          enum:
          - FORWARD_PICK
          - RESERVE
          - STAGING
          - PACK
          - DOCK
        locations:
          type: integer
          format: int32
        onHand:
          type: integer
          format: int32
      required:
      - allocated
      - available
      - locationType
      - locations
      - onHand
    LocationView:
      type: object
      properties:
        active:
          type: boolean
        capacityUnits:
          type:
          - integer
          - "null"
          format: int32
        code:
          type: string
        pickSequence:
          type:
          - integer
          - "null"
          format: int32
          description: Walking order for pick-path sequencing
        pickSlot:
          description: Set for forward-pick slots
          oneOf:
          - $ref: "#/components/schemas/PickSlotView"
          - type: "null"
        requiredEquipment:
          type:
          - string
          - "null"
          description: "Equipment needed to reach it, e.g. REACH_TRUCK"
        type:
          type: string
          enum:
          - FORWARD_PICK
          - RESERVE
          - STAGING
          - PACK
          - DOCK
        zone:
          type: string
      required:
      - active
      - code
      - type
      - zone
    MoveRequest:
      type: object
      properties:
        fromLocation:
          type: string
          maxLength: 30
          minLength: 0
        quantity:
          type: integer
          format: int32
          exclusiveMinimum: 0
        sku:
          type: string
          maxLength: 40
          minLength: 0
        toLocation:
          type: string
          maxLength: 30
          minLength: 0
      required:
      - fromLocation
      - quantity
      - sku
      - toLocation
    MovementResultView:
      type: object
      properties:
        balances:
          type: array
          items:
            $ref: "#/components/schemas/BalanceView"
        transaction:
          $ref: "#/components/schemas/TransactionView"
      required:
      - balances
      - transaction
    OrderImportRequest:
      type: object
      properties:
        orders:
          type: array
          items:
            $ref: "#/components/schemas/HostOrder"
          maxItems: 500
          minItems: 1
      required:
      - orders
    OrderImportResponse:
      type: object
      properties:
        accepted:
          type: integer
          format: int32
        duplicates:
          type: integer
          format: int32
        rejected:
          type: integer
          format: int32
        results:
          type: array
          items:
            $ref: "#/components/schemas/OrderResult"
      required:
      - accepted
      - duplicates
      - rejected
      - results
    OrderLineView:
      type: object
      properties:
        allocated:
          type: integer
          format: int32
        lineNo:
          type: integer
          format: int32
        ordered:
          type: integer
          format: int32
        picked:
          type: integer
          format: int32
        shipped:
          type: integer
          format: int32
        shortQuantity:
          type: integer
          format: int32
        sku:
          type: string
      required:
      - allocated
      - lineNo
      - ordered
      - picked
      - shipped
      - shortQuantity
      - sku
    OrderResult:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
        externalRef:
          type:
          - string
          - "null"
          description: Null only if the order had no reference
        result:
          type: string
          enum:
          - ACCEPTED
          - DUPLICATE
          - REJECTED
      required:
      - errors
      - result
    OrderSummaryView:
      type: object
      properties:
        carrier:
          type: string
        carrierCutoffAt:
          type: string
          format: date-time
        customer:
          type: string
        externalRef:
          type: string
        holdReason:
          type:
          - string
          - "null"
        lines:
          type: integer
          format: int32
        onHold:
          type: boolean
        priority:
          type: integer
          format: int32
        receivedAt:
          type: string
          format: date-time
        shortQuantity:
          type: integer
          format: int32
          description: Units ordered but not allocated
        status:
          type: string
          enum:
          - RECEIVED
          - ALLOCATED
          - RELEASED
          - PICKING
          - PICKED
          - PACKED
          - SHIPPED
          - CANCELLED
        unitsAllocated:
          type: integer
          format: int32
        unitsOrdered:
          type: integer
          format: int32
      required:
      - carrier
      - carrierCutoffAt
      - customer
      - externalRef
      - lines
      - onHold
      - priority
      - receivedAt
      - shortQuantity
      - status
      - unitsAllocated
      - unitsOrdered
    OrderView:
      type: object
      properties:
        carrier:
          type: string
        carrierCutoffAt:
          type: string
          format: date-time
        customer:
          type: string
        externalRef:
          type: string
        holdReason:
          type:
          - string
          - "null"
        lines:
          type: array
          items:
            $ref: "#/components/schemas/OrderLineView"
        onHold:
          type: boolean
        priority:
          type: integer
          format: int32
        receivedAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - RECEIVED
          - ALLOCATED
          - RELEASED
          - PICKING
          - PICKED
          - PACKED
          - SHIPPED
          - CANCELLED
      required:
      - carrier
      - carrierCutoffAt
      - customer
      - externalRef
      - lines
      - onHold
      - priority
      - receivedAt
      - status
    PageBalanceView:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BalanceView"
        nextCursor:
          type:
          - string
          - "null"
          description: Opaque cursor for the next page; null on the last page
      required:
      - items
    PageLocationView:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LocationView"
        nextCursor:
          type:
          - string
          - "null"
          description: Opaque cursor for the next page; null on the last page
      required:
      - items
    PageOrderSummaryView:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderSummaryView"
        nextCursor:
          type:
          - string
          - "null"
          description: Opaque cursor for the next page; null on the last page
      required:
      - items
    PageSkuView:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SkuView"
        nextCursor:
          type:
          - string
          - "null"
          description: Opaque cursor for the next page; null on the last page
      required:
      - items
    PageTransactionView:
      type: object
