spring:
  application:
    name: wms-core
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3307/wms}
    username: ${MYSQL_USER:wms}
    password: ${MYSQL_PASSWORD:wms}
  flyway:
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-components: always
      probes:
        enabled: true
