spring:
  application:
    name: wms-core
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3307/wms}
    username: ${MYSQL_USER:wms}
    password: ${MYSQL_PASSWORD:wms}
    hikari:
      # Fail fast when MySQL is unreachable (Hikari's default is 30s), so requests and the
      # health check report the outage promptly instead of hanging.
      connection-timeout: 5000
      # READ COMMITTED avoids InnoDB gap locks, which deadlock concurrent inserts of overlapping keys.
      # Correctness relies on explicit row locks (SELECT ... FOR UPDATE), which behave the same. See ADR 0016.
      transaction-isolation: TRANSACTION_READ_COMMITTED
      data-source-properties:
        # The server runs in UTC. Without this, Connector/J converts between the server's timestamps and the
        # JVM's local time zone, shifting every stored and read timestamp by the local UTC offset. See ADR 0018.
        connectionTimeZone: UTC
  flyway:
    locations: classpath:db/migration

springdoc:
  paths-to-match: /api/**
  writer-with-order-by-keys: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-components: always
      probes:
        enabled: true

wms:
  auth:
    # Required; the service will not start without them (ADR 0027). Set from secrets when deployed.
    supervisor-passcode: ${DEMO_PASSCODE:}
    agent-token: ${AGENT_TOKEN:}
