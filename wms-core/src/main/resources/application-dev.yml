# Local development only. The deployed demo runs the `demo` profile, which has no defaults here.
wms:
  auth:
    supervisor-passcode: ${DEMO_PASSCODE:dev-supervisor}
    agent-token: ${AGENT_TOKEN:dev-agent-token}

spring:
  flyway:
    # The demo reset wipes the schema and migrates it again (DemoData). Never enabled outside dev and demo.
    clean-disabled: false
