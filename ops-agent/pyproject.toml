[project]
name = "ops-agent"
version = "0.1.0"
description = "Investigates blocked waves in the WMS and proposes fixes for a human to approve"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.121",
    "uvicorn[standard]>=0.40",
    "httpx>=0.28",
    "anthropic>=1.8",
    "boto3>=1.40",
    "pydantic>=2.12",
    "pydantic-settings>=2.12",
]

[project.optional-dependencies]
dev = ["pytest>=9.0", "pytest-asyncio>=1.3", "ruff>=0.15"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
