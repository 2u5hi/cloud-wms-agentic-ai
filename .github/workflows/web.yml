name: web

on:
  pull_request:
    paths:
      - "web/**"
      - "contracts/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:
  # Called by deploy.yml on every push to main, so nothing ships without passing this.
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      # The committed client types must match contracts/openapi.yaml.
      - name: Check API client is up to date
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts || {
            echo "::error::web/src/api/schema.d.ts is out of date. Run 'npm run gen:api' in web/ and commit the result."
            exit 1
          }

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Typecheck and build
        run: npm run build
