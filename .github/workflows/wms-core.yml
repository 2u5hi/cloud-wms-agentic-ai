name: wms-core

on:
  push:
    branches: [main]
    paths:
      - "wms-core/**"
      - "contracts/**"
      - ".github/workflows/wms-core.yml"
  pull_request:
    paths:
      - "wms-core/**"
      - "contracts/**"
      - ".github/workflows/wms-core.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wms-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: wms-core
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Unit tests, Testcontainers integration tests (Docker is available on the runner),
      # and the OpenAPI contract drift check.
      - name: Build and test
        run: ./mvnw -B verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: wms-core/target/surefire-reports/
